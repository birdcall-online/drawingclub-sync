name: Sync Discord Images to Are.na

on:
  schedule:
    # 11:17, 17:17, 23:17, 05:17 KST
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업"
        type: choice
        default: all
        options:
          - all
          - sync 
          - data 

concurrency:
  group: arena-discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Script
        if: github.event_name != 'workflow_dispatch' || inputs.task != 'data'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
          ARENA_GROUP: ${{ secrets.ARENA_GROUP }}
          CSV_URL: ${{ secrets.CSV_URL }}
        run: node script.mjs
        
      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Commit state.json
        if: github.event_name != 'workflow_dispatch' || inputs.task != 'data'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update state.json [skip ci]"
          file_pattern: "state.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          
      - name: Run Data Script
        if: github.event_name != 'workflow_dispatch' || inputs.task != 'sync'
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
          ARENA_CHANNEL: ${{ secrets.ARENA_CHANNEL }}
        run: node data.mjs

      - name: Commit data
        if: github.event_name != 'workflow_dispatch' || inputs.task != 'sync'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update data [skip ci]"
          file_pattern: "data/*.json list.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
